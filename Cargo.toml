[package]
name = "wallpaper"
version = "260911.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
eframe = "0.33"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
auto-launch = "0.6"
wallpaper = "3"
tempfile = "3"
rand = "0.8"
